<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ghent in voxels · Explore the historic centre</title>
  <meta name="description" content="Explore Ghent in 1 metre voxels, using official Stad Gent 3D buildings and terrain, the municipal tree inventory and OpenStreetMap. Fly, walk, and change the light and weather." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://hansf.github.io/voxelgent/" />
  <meta property="og:title" content="Ghent in voxels" />
  <meta property="og:description" content="A voxel city built from Ghent’s open 3D data and tree inventory." />
  <meta property="og:image" content="https://hansf.github.io/voxelgent/ghent/preview.png" />
  <meta property="og:image:alt" content="Ghent’s historic centre in voxels, with scheduled bus and tram estimates" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%225%22 y=%222%22 width=%226%22 height=%2214%22 fill=%22%23c6ae7f%22/%3E%3Crect x=%227%22 y=%220%22 width=%222%22 height=%223%22 fill=%22%23f2c200%22/%3E%3Crect x=%222%22 y=%229%22 width=%2212%22 height=%227%22 fill=%22%23b39a6b%22/%3E%3C/svg%3E" />
  <!-- usage stats (src/stats.ts), sent from the first moment -->
  <script>
    (() => {
      const key = '%VITE_POSTHOG_PROJECT_TOKEN%', build = '%VITE_BUILD%';
      const on = key.startsWith('phc_') && !navigator.webdriver && (location.hostname === 'p.migdal.pl' || /[?&]stats\b/.test(location.search));
      const common = { distinct_id: '$posthog_cookieless', $cookieless_mode: true, $host: location.host, $current_url: location.href,
        $raw_user_agent: navigator.userAgent, pid: Math.random().toString(36).slice(2, 10), build: build.startsWith('%') ? 'dev' : build.slice(0, 7) };
      const send = (event, props) => {
        if (!on) return;
        try {
          fetch('https://eu.i.posthog.com/i/v0/e/', { method: 'POST', keepalive: true, headers: { 'content-type': 'text/plain' },
            body: JSON.stringify({ api_key: key, event, timestamp: new Date().toISOString(), properties: { ...common, t: +(performance.now() / 1000).toFixed(2), ...props } }) }).catch(() => {});
        } catch {}
      };
      let errors = 0;
      addEventListener('error', (e) => {
        if (errors++ >= 5) return;
        const src = e.target && e.target !== window ? e.target.src || e.target.href : null;
        send('error', src ? { message: 'failed to load', source: String(src).split('/').pop() } : { message: String(e.message).slice(0, 200), source: String(e.filename).split('/').pop() });
      }, true);
      addEventListener('unhandledrejection', (e) => { if (errors++ < 5) send('error', { message: String(e.reason).slice(0, 200) }); });
      window.__stats = { on, key, common, send };
      send('open', { connection: navigator.connection?.effectiveType ?? null, width: innerWidth, height: innerHeight, dpr: devicePixelRatio });
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <!-- the loading caption, styled before any script or stylesheet arrives (same look as style.css #loading) -->
  <style>
    body { margin: 0; }
    #loading { position: fixed; inset: 0; background: linear-gradient(#c9d3dc, #e7e2d8 70%); z-index: 10; }
    #loading-text { position: fixed; left: 14px; top: 14px; color: #fff; font: 11px Inter, system-ui, sans-serif; text-shadow: 0 1px 2px rgba(0,0,0,.7), 0 0 2px rgba(0,0,0,.5); }
  </style>
</head>
<body class="loading">
  <div id="app"></div>
  <div id="labels"></div>
  <div id="loading"><div id="loading-text">Loading the map data…</div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
